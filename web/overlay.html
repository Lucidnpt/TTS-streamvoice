<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StreamVoice overlay</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #cap {
    position: fixed; left: 50%; transform: translateX(-50%);
    max-width: 90vw; text-align: center; opacity: 0; transition: opacity .15s;
    font: 600 var(--size, 44px)/1.25 "Segoe UI", system-ui, sans-serif;
    color: #fff;
    text-shadow: 0 0 6px #000, 0 2px 4px #000, 2px 0 0 #000, -2px 0 0 #000, 0 -2px 0 #000;
  }
  #cap.show { opacity: 1; }
</style>
</head>
<body>
<div id="cap"></div>
<script>
  // Tham số tùy chọn trên URL: ?size=44&pos=bottom|top&hold=1000&delay=0
  const q = new URLSearchParams(location.search);
  const cap = document.getElementById('cap');
  const hold = Number(q.get('hold') || 1000);    // ms giữ phụ đề sau khi câu nói xong
  const delay = Number(q.get('delay') || 0);     // ms, chỉnh nếu phụ đề lệch so với tiếng
  cap.style.setProperty('--size', (q.get('size') || 44) + 'px');
  cap.style[q.get('pos') === 'top' ? 'top' : 'bottom'] = '6vh';

  let timer;
  const later = fn => (delay ? setTimeout(fn, delay) : fn());
  const hide = () => cap.classList.remove('show');

  function show(text, duration) {
    cap.textContent = text;
    cap.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(hide, duration * 1000 + hold);
  }

  function connect() {
    const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/overlay`);
    ws.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.type === 'caption') later(() => show(m.text, m.duration));
      else if (m.type === 'caption_clear') later(() => { clearTimeout(timer); hide(); });
    };
    ws.onclose = () => setTimeout(connect, 1000);
  }
  connect();
</script>
</body>
</html>
