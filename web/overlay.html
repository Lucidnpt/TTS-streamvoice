<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StreamVoice overlay</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #cap {
    position: fixed; left: 50%; bottom: 6vh; transform: translateX(-50%);
    max-width: 90vw; text-align: center; opacity: 0; transition: opacity .15s;
    font-size: var(--size, 44px); font-weight: 600; line-height: 1.25;
    font-family: var(--font, "Segoe UI"), system-ui, sans-serif;
    color: var(--color, #fff);
    --o: var(--outline, #000);
    text-shadow: 0 0 6px var(--o), 0 2px 4px var(--o), 2px 0 0 var(--o), -2px 0 0 var(--o), 0 -2px 0 var(--o);
  }
  #cap.show { opacity: 1; }
</style>
</head>
<body>
<div id="cap"></div>
<script>
  // Kiểu chữ lấy từ cài đặt trong app (cập nhật trực tiếp qua WebSocket).
  // Tham số trên URL nếu có sẽ được ưu tiên: ?size=44&pos=bottom|top&font=Arial&color=ffffff&outline=000000
  // Ngoài ra: &hold=1000 (ms giữ phụ đề sau khi nói xong), &delay=0 (ms, chỉnh nếu phụ đề lệch so với tiếng)
  const q = new URLSearchParams(location.search);
  const cap = document.getElementById('cap');
  const hold = Number(q.get('hold') || 1000);
  const delay = Number(q.get('delay') || 0);
  const hex = v => (v && /^#?[0-9a-f]{6}$/i.test(v) ? (v[0] === '#' ? v : '#' + v) : null);

  function applyStyle(s) {
    const size = q.get('size') || s.font_size;
    const font = q.get('font') || s.font_family;
    const color = hex(q.get('color')) || s.color;
    const outline = hex(q.get('outline')) || s.outline_color;
    const pos = q.get('pos') || s.position;
    if (size) cap.style.setProperty('--size', size + 'px');
    if (font) cap.style.setProperty('--font', JSON.stringify(String(font)));
    if (color) cap.style.setProperty('--color', color);
    if (outline) cap.style.setProperty('--outline', outline);
    const top = pos === 'top';
    cap.style.top = top ? '6vh' : 'auto';
    cap.style.bottom = top ? 'auto' : '6vh';
  }
  applyStyle({});

  let timer;
  const later = fn => (delay ? setTimeout(fn, delay) : fn());
  const hide = () => cap.classList.remove('show');

  function show(text, duration) {
    cap.textContent = text;
    cap.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(hide, duration * 1000 + hold);
  }

  // ?demo=1: luôn hiện một câu mẫu (dùng để xem trước kiểu chữ)
  if (q.get('demo')) { cap.textContent = q.get('demo') === '1' ? 'Hello everyone, welcome to the stream!' : q.get('demo'); cap.classList.add('show'); }

  function connect() {
    const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws/overlay`);
    ws.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.type === 'overlay_style') applyStyle(m);
      else if (q.get('demo')) return;
      else if (m.type === 'caption') later(() => show(m.text, m.duration));
      else if (m.type === 'caption_clear') later(() => { clearTimeout(timer); hide(); });
    };
    ws.onclose = () => setTimeout(connect, 1000);
  }
  connect();
</script>
</body>
</html>
